name: baidu-buzz-proxy

services:
  app:
    image: ${BBP_IMAGE:?Set BBP_IMAGE to a published application image}
    pull_policy: never
    env_file:
      - path: .env
      - path: .runtime.env
        required: false
    environment:
      BBP_ENVIRONMENT: production
      BBP_HOST: 0.0.0.0
      BBP_PORT: 8000
      BBP_DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      BBP_REDIS_URL: redis://redis:6379/0
      BBP_BAIDU_PCS_GO_PATH: /app/data/baidu/BaiduPCS-Go
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - app-data:/app/data
      - ./.runtime-secrets/baidu-cookies:/run/secrets/baidu-cookies:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 360s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:8.8.1-alpine3.23
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.29.8-alpine3.23
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${BBP_HTTP_BIND:-127.0.0.1}:${BBP_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  app-data:
  redis-data:
