name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA whose image should be deployed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Validate release
        id: release
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$SSH_PRIVATE_KEY" || -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "Production SSH secrets are not configured" >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Sync runtime configuration
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ADMIN_ACCESS_TOKEN: ${{ secrets.BBP_ADMIN_ACCESS_TOKEN }}
          ADMIN_JWT_SECRET: ${{ secrets.BBP_ADMIN_JWT_SECRET }}
          BUZZHEAVIER_ACCESS_TOKEN: ${{ secrets.BBP_BUZZHEAVIER_ACCESS_TOKEN }}
          TURNSTILE_SECRET_KEY: ${{ secrets.BBP_TURNSTILE_SECRET_KEY }}
          BAIDU_COOKIES: ${{ secrets.BBP_BAIDU_COOKIES }}
          BAIDU_PCS_CONFIG: ${{ secrets.BBP_BAIDU_PCS_CONFIG }}
          TURNSTILE_SITE_KEY: ${{ vars.BBP_TURNSTILE_SITE_KEY }}
          BAIDU_RESERVE_GIB: ${{ vars.BBP_BAIDU_RESERVE_GIB }}
          MAX_ACTIVE_JOBS: ${{ vars.BBP_MAX_ACTIVE_JOBS }}
          MAX_PENDING_JOBS: ${{ vars.BBP_MAX_PENDING_JOBS }}
          JOB_PAGE_TTL_DAYS: ${{ vars.BBP_JOB_PAGE_TTL_DAYS }}
          FAILED_JOB_TTL_HOURS: ${{ vars.BBP_FAILED_JOB_TTL_HOURS }}
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || ! "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "VPS connection secrets are invalid" >&2
            exit 1
          fi
          if [[ -z "$ADMIN_ACCESS_TOKEN" ]]; then
            echo "BBP_ADMIN_ACCESS_TOKEN is required" >&2
            exit 1
          fi

          retry() {
            local attempt=1
            local max_attempts=4
            local delay=3
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "SSH operation failed after $attempt attempts" >&2
                return 1
              fi
              echo "SSH operation failed; retrying in ${delay}s ($attempt/$max_attempts)" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          ssh_options=(
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
          )
          scp_options=(
            -P "$VPS_PORT"
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=3
            -o IdentitiesOnly=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=yes
          )

          runtime_dir="$RUNNER_TEMP/bbp-runtime"
          install -d -m 700 "$runtime_dir"
          runtime_env="$runtime_dir/runtime.env"
          cookie_file="$runtime_dir/baidu-cookies"
          pcs_config_file="$runtime_dir/baidu-pcs-config"
          umask 077

          write_env() {
            local key="$1"
            local value="$2"
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "$key contains a line break" >&2
              exit 1
            fi
            value="${value//\\/\\\\}"
            value="${value//\"/\\\"}"
            value="${value//\$/\$\$}"
            printf '%s="%s"\n' "$key" "$value" >> "$runtime_env"
          }

          write_env BBP_ADMIN_ACCESS_TOKEN "$ADMIN_ACCESS_TOKEN"
          write_env BBP_ADMIN_JWT_SECRET "$ADMIN_JWT_SECRET"
          write_env BBP_BUZZHEAVIER_ACCESS_TOKEN "$BUZZHEAVIER_ACCESS_TOKEN"
          write_env BBP_TURNSTILE_SECRET_KEY "$TURNSTILE_SECRET_KEY"
          write_env BBP_TURNSTILE_SITE_KEY "$TURNSTILE_SITE_KEY"
          write_env BBP_BAIDU_RESERVE_GIB "${BAIDU_RESERVE_GIB:-300}"
          write_env BBP_MAX_ACTIVE_JOBS "${MAX_ACTIVE_JOBS:-2}"
          write_env BBP_MAX_PENDING_JOBS "${MAX_PENDING_JOBS:-100}"
          write_env BBP_JOB_PAGE_TTL_DAYS "${JOB_PAGE_TTL_DAYS:-8}"
          write_env BBP_FAILED_JOB_TTL_HOURS "${FAILED_JOB_TTL_HOURS:-24}"

          if [[ "$BAIDU_COOKIES" == *$'\n'* || "$BAIDU_COOKIES" == *$'\r'* ]]; then
            echo "BBP_BAIDU_COOKIES contains a line break" >&2
            exit 1
          fi
          printf '%s' "$BAIDU_COOKIES" > "$cookie_file"
          printf '%s' "$BAIDU_PCS_CONFIG" > "$pcs_config_file"

          remote_dir=/opt/baidu-buzz-proxy
          retry ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "install -d -m 700 '$remote_dir/.runtime-secrets'"
          retry scp "${scp_options[@]}" "$runtime_env" \
            "$VPS_USER@$VPS_HOST:$remote_dir/.runtime.env.tmp"
          retry scp "${scp_options[@]}" "$cookie_file" \
            "$VPS_USER@$VPS_HOST:$remote_dir/.runtime-secrets/baidu-cookies.tmp"
          retry scp "${scp_options[@]}" "$pcs_config_file" \
            "$VPS_USER@$VPS_HOST:$remote_dir/.runtime-secrets/baidu-pcs-config.tmp"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "chmod 600 '$remote_dir/.runtime.env.tmp' \
              '$remote_dir/.runtime-secrets/baidu-cookies.tmp' \
              '$remote_dir/.runtime-secrets/baidu-pcs-config.tmp' && \
             mv -f '$remote_dir/.runtime.env.tmp' '$remote_dir/.runtime.env' && \
             mv -f '$remote_dir/.runtime-secrets/baidu-cookies.tmp' \
              '$remote_dir/.runtime-secrets/baidu-cookies' && \
             mv -f '$remote_dir/.runtime-secrets/baidu-pcs-config.tmp' \
              '$remote_dir/.runtime-secrets/baidu-pcs-config' && \
             chmod 644 '$remote_dir/.runtime-secrets/baidu-cookies' \
              '$remote_dir/.runtime-secrets/baidu-pcs-config'"

      - name: Deploy release
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" || ! "$VPS_PORT" =~ ^[0-9]+$ ]]; then
            echo "VPS connection secrets are invalid" >&2
            exit 1
          fi
          ssh \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ConnectionAttempts=3 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$RELEASE_IMAGE' '$RELEASE_SHA'" \
            < deploy/vps-deploy.sh
